name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  setup-test-environment:
    runs-on: ubuntu-latest
    
    outputs:
      backend-url: ${{ steps.setup.outputs.backend-url }}
      frontend-url: ${{ steps.setup.outputs.frontend-url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and start services
      run: |
        docker-compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
        
    - name: Wait for services to be ready
      run: |
        timeout 300 bash -c 'until curl -f http://localhost:5000/; do sleep 5; done'
        timeout 300 bash -c 'until curl -f http://localhost:80/; do sleep 5; done'
        
    - name: Setup outputs
      id: setup
      run: |
        echo "backend-url=http://localhost:5000" >> $GITHUB_OUTPUT
        echo "frontend-url=http://localhost:80" >> $GITHUB_OUTPUT

  api-integration-tests:
    runs-on: ubuntu-latest
    needs: setup-test-environment
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install requests pytest

    - name: Run API integration tests
      run: |
        python -c "
import requests
import time
import json

# Wait for services
time.sleep(30)

base_url = 'http://localhost:5000'
results = []

try:
    # Test health endpoint
    response = requests.get(f'{base_url}/')
    results.append(('Health Check', response.status_code == 200))
    
    # Test user registration
    user_data = {'username': 'testuser123', 'password': 'testpass123'}
    response = requests.post(f'{base_url}/register', json=user_data)
    results.append(('User Registration', response.status_code in [200, 201]))
    
    # Test user login
    login_data = {'username': 'testuser123', 'password': 'testpass123'}
    response = requests.post(f'{base_url}/login', json=login_data)
    results.append(('User Login', response.status_code == 200))
    
    # Test protected endpoint
    if response.status_code == 200:
        token = response.json().get('token')
        headers = {'Authorization': f'Bearer {token}'}
        response = requests.get(f'{base_url}/protected', headers=headers)
        results.append(('Protected Endpoint', response.status_code == 200))
    
    # Print results
    print('Integration Test Results:')
    for test, passed in results:
        status = '✅ PASS' if passed else '❌ FAIL'
        print(f'{test}: {status}')
    
    # Exit with error if any test failed
    if not all(passed for _, passed in results):
        exit(1)
        
except Exception as e:
    print(f'Integration test failed: {e}')
    exit(1)
"

  e2e-tests:
    runs-on: ubuntu-latest
    needs: setup-test-environment
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'

    - name: Install dependencies
      run: |
        npm install -g @playwright/test
        npm install

    - name: Install Playwright browsers
      run: |
        npx playwright install --with-deps

    - name: Run E2E tests
      run: |
        npx playwright test --config=playwright.config.js

    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  load-tests:
    runs-on: ubuntu-latest
    needs: setup-test-environment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install locust

    - name: Run load tests
      run: |
        python -c \"\"\"from locust import HttpUser, task, between
import time

class LoginUser(HttpUser):
    wait_time = between(1, 3)
    
    def on_start(self):
        self.login()
    
    def login(self):
        response = self.client.post('/login', json={
            'username': 'testuser',
            'password': 'testpass'
        })
        if response.status_code == 200:
            self.token = response.json().get('token')
    
    @task
    def view_protected_page(self):
        if hasattr(self, 'token'):
            headers = {'Authorization': f'Bearer {self.token}'}
            self.client.get('/protected', headers=headers)
    
    @task(3)
    def view_home_page(self):
        self.client.get('/')

if __name__ == '__main__':
    import subprocess
    import sys
    
    # Run locust in headless mode
    cmd = [
        'locust', '-f', sys.argv[0], '--headless',
        '--users', '10', '--spawn-rate', '2',
        '--run-time', '30s', '--host', 'http://localhost:5000'
    ]
    
    try:
        subprocess.run(cmd, check=True)
        print('Load tests completed successfully')
    except subprocess.CalledProcessError as e:
        print(f'Load tests failed: {e}')
        exit(1)
\"\"\"

  cleanup:
    runs-on: ubuntu-latest
    needs: [api-integration-tests, e2e-tests, load-tests]
    if: always()
    
    steps:
    - name: Cleanup test environment
      run: |
        docker-compose -f docker-compose.yml -f docker-compose.test.yml down -v
        docker system prune -f

  notify-results:
    runs-on: ubuntu-latest
    needs: [api-integration-tests, e2e-tests, load-tests]
    if: always()
    
    steps:
    - name: Notify test results
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#ci-cd'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        message: |
          Integration Tests ${{ job.status }}
          API Tests: ${{ needs.api-integration-tests.result }}
          E2E Tests: ${{ needs.e2e-tests.result }}
          Load Tests: ${{ needs.load-tests.result }}
          Commit: ${{ github.sha }}
          By: ${{ github.actor }}
