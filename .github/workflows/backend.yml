name: Backend Pipeline

on:
  push:
    branches: [main, develop, feature/*]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black isort safety bandit

      - name: 🔍 Lint (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

      - name: 🎨 Format check (black)
        run: black --check .

      - name: 📚 Import check (isort)
        run: isort --check-only .

      - name: 🧪 Run tests
        run: pytest -v --cov=. --cov-report=xml --cov-report=html

      - name: 🛡️ Safety check
        run: safety check --json --output safety-report.json

      - name: 🕵️ Bandit security scan
        run: bandit -r . -f json -o bandit-report.json

      - name: 📈 Upload coverage
        uses: codecov/codecov-action@v6
        with:
          file: backend/coverage.xml
          flags: backend

      - name: 📤 Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/safety-report.json
            backend/bandit-report.json

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build & push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/login-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/login-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🧪 Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/login-backend:latest
          format: sarif
          output: trivy-results.sarif

      - name: 📤 Upload security scan
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    environment: production

    steps:
      - name: 🚀 Deploy
        run: |
          echo "Deploying backend..."
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/login-backend:${{ github.sha }}"
          echo "Deployment completed!"
