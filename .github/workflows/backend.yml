name: Backend Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: 📦 Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black isort safety bandit

    - name: 🔍 Lint with flake8
      run: |
        cd backend
        echo "🔍 Running flake8 linting..."
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 🎨 Check code formatting with black
      run: |
        cd backend
        echo "🎨 Checking code formatting with black..."
        black --check --diff .

    - name: 📚 Check import sorting with isort
      run: |
        cd backend
        echo "📚 Checking import sorting with isort..."
        isort --check-only --diff .

    - name: 🧪 Run unit tests
      run: |
        cd backend
        echo "🧪 Running unit tests..."
        python -m pytest test_security.py -v --cov=. --cov-report=xml --cov-report=html
        echo "✅ Unit tests completed"

    - name: 🔒 Run security tests
      run: |
        cd backend
        echo "🔒 Running security tests..."
        python -m pytest test_security.py::TestSecurity -v
        echo "✅ Security tests completed"

    - name: 🛡️ Run safety check
      run: |
        cd backend
        echo "🛡️ Running safety check..."
        safety check --json --output safety-report.json || true
        echo "✅ Safety check completed"

    - name: 🕵️ Run bandit security scan
      run: |
        cd backend
        echo "🕵️ Running bandit security scan..."
        bandit -r . -f json -o bandit-report.json || true
        echo "✅ Bandit scan completed"

    - name: 📊 Test database operations
      run: |
        cd backend
        echo "📊 Testing database operations..."
        python -c "import database; import os; os.remove('users.db') if os.path.exists('users.db') else None; from migrate import main; main(); print('✅ Database operations tested successfully')"

    - name: 📈 Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage

    - name: 📤 Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: backend-security-reports
        path: |
          backend/safety-report.json
          backend/bandit-report.json
        retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: 🔐 Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 🏗️ Build and push backend image
      uses: docker/build-push-action@v5
      id: build
      with:
        context: ./backend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/login-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/login-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.title=Login Backend
          org.opencontainers.image.description=Backend Flask application for login system
          org.opencontainers.image.version=${{ github.sha }}

    - name: 🏷️ Set image tag output
      id: meta
      run: |
        echo "tags=${{ secrets.DOCKER_USERNAME }}/login-backend:${{ github.sha }}" >> $GITHUB_OUTPUT

    - name: 🔍 Run security scan on image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.DOCKER_USERNAME }}/login-backend:latest
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: 📤 Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

    - name: ✅ Build completed
      run: |
        echo "🎉 Backend build completed successfully!"
        echo "🏷️ Image: ${{ secrets.DOCKER_USERNAME }}/login-backend:${{ github.sha }}"
        echo "🔗 Docker Hub: https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/login-backend",
        
  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: 🚀 Deploy backend
      run: |
        echo "🚀 Deploying backend to production..."
        echo "🏷️ Image: ${{ needs.build.outputs.image-tag }}"
        echo "🌐 Backend will be available at: http://your-domain.com:5000"
        echo "✅ Backend deployment completed!"

    - name: 📢 Notify deployment
      if: always()
      run: |
        echo "📢 Backend deployment notification sent"
        echo "📊 Status: ${{ job.status }}"
        echo "🔗 Commit: ${{ github.sha }}"
