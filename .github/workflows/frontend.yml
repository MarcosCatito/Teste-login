name: Frontend Pipeline

on:
  push:
    branches: [main, develop, feature/*]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint --if-present

      - name: 🎨 Prettier check
        run: npm run format:check --if-present

      - name: 🧪 Tests
        run: npm test -- --coverage --watchAll=false --passWithNoTests

      - name: 🏗️ Build
        run: npm run build

      - name: 🌐 Accessibility tests
        run: |
          npm install -g @axe-core/cli
          axe build/index.html --tags wcag2a,wcag2aa

      - name: 📈 Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: frontend/coverage/lcov.info
          flags: frontend

      - name: 🛡️ NPM audit (fail on issues)
        run: npm audit --audit-level=high

      - name: 📤 Upload audit report
        run: npm audit --json > audit-report.json

      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: frontend/audit-report.json

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build & push image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/login-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/login-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍 Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/login-frontend:latest
          format: sarif
          output: trivy-results.sarif

      - name: 📤 Upload security scan
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: 🚀 Deploy frontend
        run: |
          echo "Deploying frontend..."
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/login-frontend:${{ github.sha }}"
          echo "Deployment completed!"